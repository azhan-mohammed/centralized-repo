name: Centralized Rollback

on:
  workflow_call:

permissions:
  contents: write

jobs:
  centralized_rollback:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find Latest Merge Commit
        id: latest_merge
        run: |
          MERGE_COMMIT=$(git log --merges --format="%H" -1)
          echo "Latest merge commit: $MERGE_COMMIT"
          echo "MERGE_COMMIT=$MERGE_COMMIT" >> $GITHUB_ENV

      - name: Revert Latest Merge Commit
        run: |
          git revert -m 1 --no-edit $MERGE_COMMIT

      - name: Push Changes
        run: |
          git push origin HEAD

    # steps:
